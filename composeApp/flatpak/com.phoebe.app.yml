app-id: com.phoebe.app
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
command: Phoebe

finish-args:
  - --share=ipc
  - --share=network
  # Compose Desktop still uses AWT on Linux; fallback-x11 hides the XWayland socket on
  # Wayland sessions, which makes the JVM start headless and exit immediately.
  - --socket=x11
  - --socket=wayland
  - --socket=pulseaudio
  # Java Sound routes through ALSA; default to the Flatpak Pulse bridge.
  - --env=ALSA_PCM_NAME=pulse
  - --talk-name=org.freedesktop.Flatpak
  - --talk-name=org.freedesktop.secrets
  - --device=dri
  # Read-only host home lets folder picks and legacy ~/.phoebe migration reach real paths.
  - --filesystem=home:ro
  - --filesystem=xdg-music:ro
  - --filesystem=xdg-download:ro

modules:
  - name: phoebe
    buildsystem: simple
    build-commands:
      - install -d /app/bin /app/lib/phoebe
      - cp -a phoebe/. /app/lib/phoebe/
      - ln -s /app/lib/phoebe/bin/Phoebe /app/bin/Phoebe
      - install -Dm644 com.phoebe.app.desktop /app/share/applications/com.phoebe.app.desktop
      - install -Dm644 com.phoebe.app.metainfo.xml /app/share/metainfo/com.phoebe.app.metainfo.xml
      - install -Dm644 com.phoebe.app.png /app/share/icons/hicolor/512x512/apps/com.phoebe.app.png
    sources:
      - type: dir
        path: ../build/compose/binaries/main-release/app/Phoebe
        dest: phoebe
      - type: file
        path: com.phoebe.app.desktop
      - type: file
        path: com.phoebe.app.metainfo.xml
      - type: file
        path: ../src/desktopMain/resources/icons/icon.png
        dest-filename: com.phoebe.app.png
