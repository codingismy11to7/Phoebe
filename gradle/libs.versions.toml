[versions]
agp = "8.9.3"
compose = "1.10.0"
kotlin = "2.2.21"
coroutines = "1.10.2"
ktor = "3.3.2"
serialization = "1.9.0"
activityCompose = "1.11.0"
media3 = "1.8.0"
documentfile = "1.0.1"
junit = "4.13.2"
javafx = "21.0.11"
jaudiotagger = "3.0.1"
