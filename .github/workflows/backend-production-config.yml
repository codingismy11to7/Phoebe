name: Backend Production Config

on:
  pull_request_target:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-production-config:
    name: Backend production config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PHOEBE_BACKEND_PROD || secrets.VERCEL_PROJECT_ID_EVENTS_PROD }}

    steps:
      - name: Validate Vercel access secrets
        shell: bash
        run: |
          missing=()
          [[ -n "${VERCEL_TOKEN}" ]] || missing+=("VERCEL_TOKEN")
          [[ -n "${VERCEL_ORG_ID}" ]] || missing+=("VERCEL_ORG_ID")
          [[ -n "${VERCEL_PROJECT_ID}" ]] || missing+=("VERCEL_PROJECT_ID_PHOEBE_BACKEND_PROD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Phoebe backend Vercel access secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate production backend env
        shell: bash
        run: |
          set -euo pipefail
          env_json="$(vercel env ls production --format json --token "${VERCEL_TOKEN}")"
          ENV_JSON="${env_json}" node <<'NODE'
          const payload = JSON.parse(process.env.ENV_JSON || "{}");
          const keys = new Set((payload.envs || []).map((env) => env.key));
          const missing = [
            "TICKETMASTER_API_KEY",
            "SEATGEEK_CLIENT_ID",
            "GENIUS_ACCESS_TOKEN",
            "ALLOWED_ORIGINS",
          ].filter((name) => !keys.has(name));

          if (missing.length > 0) {
            console.error(`::error::Missing required Phoebe backend production env values: ${missing.join(" ")}`);
            process.exit(1);
          }

          console.log("Phoebe backend production env includes the values required by release smoke tests.");
          NODE
