name: Backend Production Config

on:
  pull_request_target:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend-production-config:
    name: Backend production config
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID_PHOEBE_BACKEND_PROD || secrets.VERCEL_PROJECT_ID_EVENTS_PROD }}

    steps:
      - name: Validate Vercel access secrets
        shell: bash
        run: |
          missing=()
          [[ -n "${VERCEL_TOKEN}" ]] || missing+=("VERCEL_TOKEN")
          [[ -n "${VERCEL_ORG_ID}" ]] || missing+=("VERCEL_ORG_ID")
          [[ -n "${VERCEL_PROJECT_ID}" ]] || missing+=("VERCEL_PROJECT_ID_PHOEBE_BACKEND_PROD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Phoebe backend Vercel access secrets: ${missing[*]}"
            exit 1
          fi

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Validate production backend env
        shell: bash
        run: |
          set -euo pipefail
          vercel pull --yes --environment=production --token "${VERCEL_TOKEN}" >/dev/null

          set -a
          # shellcheck disable=SC1091
          source .vercel/.env.production.local
          set +a

          missing=()
          require_non_empty() {
            local name="$1"
            local value="${!name-}"
            if [[ -z "${value:-}" ]]; then
              missing+=("${name}")
            fi
          }

          is_truthy() {
            case "${1:-}" in
              1|true|TRUE|yes|YES|on|ON) return 0 ;;
              *) return 1 ;;
            esac
          }

          require_non_empty "TICKETMASTER_API_KEY"
          require_non_empty "SEATGEEK_CLIENT_ID"
          require_non_empty "GENIUS_ACCESS_TOKEN"

          if [[ -z "${ALLOWED_ORIGINS:-}" ]] && ! is_truthy "${BACKEND_ALLOW_ANY_ORIGIN:-}"; then
            missing+=("ALLOWED_ORIGINS")
          fi

          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Phoebe backend production env values: ${missing[*]}"
            exit 1
          fi

          echo "Phoebe backend production env includes the values required by release smoke tests."
