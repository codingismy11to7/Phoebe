name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-test:
    name: Desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run desktop tests
        run: ./gradlew :composeApp:desktopTest

      - name: Upload desktop screenshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshot-artifacts
          if-no-files-found: ignore
          path: |
            composeApp/build/reports/roborazzi/**
            composeApp/build/outputs/roborazzi/**
            composeApp/build/test-results/desktopTest/**

  android-screenshots:
    name: Android screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android screenshots
        run: ./gradlew :composeApp:verifyRoborazziDebug

      - name: Upload Android screenshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshot-artifacts
          if-no-files-found: ignore
          path: |
            composeApp/build/reports/roborazzi/**
            composeApp/build/outputs/roborazzi/**
            composeApp/build/test-results/testDebugUnitTest/**

  web-screenshots:
    name: Web screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web screenshot dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run web:install-browsers

      - name: Build wasm web bundle
        run: ./gradlew :composeApp:wasmJsBrowserDevelopmentWebpack

      - name: Verify web screenshots
        run: npm run web:screenshots

      - name: Upload web screenshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshot-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/**
            test-results/**
            web-screenshot-tests/**/*-snapshots/**

  wasm-test:
    name: Wasm JS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run wasm JS tests
        run: ./gradlew :composeApp:wasmJsTest

  android-instrumented-tests:
    name: Android instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :composeApp:connectedDebugAndroidTest
