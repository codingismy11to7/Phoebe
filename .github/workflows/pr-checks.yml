name: PR Checks

on:
  pull_request:
    branches:
      - main

concurrency:
  group: pr-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  desktop-test:
    name: Desktop tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch test audio fixtures
        run: ./scripts/fetch-test-audio.sh

      - name: Run desktop tests
        run: ./gradlew :composeApp:desktopTest -Pphoebe.realAudioTests=true

      - name: Upload desktop screenshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-screenshot-artifacts
          if-no-files-found: ignore
          path: |
            composeApp/build/reports/roborazzi/**
            composeApp/build/outputs/roborazzi/**
            composeApp/build/test-results/desktopTest/**

  android-screenshots:
    name: Android screenshots
    runs-on: macos-26
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Verify Android screenshots
        run: ./gradlew :composeApp:verifyRoborazziDebug

      - name: Upload Android screenshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: android-screenshot-artifacts
          if-no-files-found: ignore
          path: |
            composeApp/build/reports/roborazzi/**
            composeApp/build/outputs/roborazzi/**
            composeApp/build/test-results/testDebugUnitTest/**

  ios-build:
    name: iOS build
    # Compose 1.11 links UIViewLayoutRegion (iOS 26 SDK); Xcode 16.x only supports deployment targets up to 18.5.
    runs-on: macos-26
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode 26
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26'

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build iOS app
        run: >
          xcodebuild
          -project iosApp/iosApp.xcodeproj
          -scheme iosApp
          -configuration Debug
          -destination 'generic/platform=iOS Simulator'
          build

  web-screenshots:
    name: Web screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install web screenshot dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npm run web:install-browsers

      - name: Build wasm web bundle
        run: ./gradlew :composeApp:wasmJsBrowserDevelopmentWebpack

      - name: Verify web screenshots
        run: npm run web:screenshots

      - name: Run web E2E checks
        run: npm run web:e2e

      - name: Upload web screenshot artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: web-screenshot-artifacts
          if-no-files-found: ignore
          path: |
            playwright-report/**
            test-results/**
            web-screenshot-tests/**/*-snapshots/**

  wasm-test:
    name: Wasm JS tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run wasm JS tests
        run: ./gradlew :composeApp:wasmJsTest

  android-instrumented-tests:
    name: Android instrumented tests
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Fetch test audio fixtures
        run: ./scripts/fetch-test-audio.sh

      - name: Run Android instrumented tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: ./gradlew :composeApp:connectedDebugAndroidTest -Pphoebe.realAudioTests=true

  web-preview-deploy:
    name: Deploy web preview
    needs:
      - web-screenshots
      - wasm-test
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WEB_DEPLOY_HOST: ${{ secrets.WEB_DEPLOY_HOST }}
      WEB_DEPLOY_USER: ${{ secrets.WEB_DEPLOY_USER }}
      WEB_DEPLOY_SSH_KEY: ${{ secrets.WEB_DEPLOY_SSH_KEY }}
      WEB_DEPLOY_KNOWN_HOSTS: ${{ secrets.WEB_DEPLOY_KNOWN_HOSTS }}
      WEB_PREVIEW_DEPLOY_PATH: ${{ secrets.WEB_PREVIEW_DEPLOY_PATH }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate web preview deploy settings
        shell: bash
        run: |
          missing=()
          [[ -n "${WEB_DEPLOY_HOST}" ]] || missing+=("WEB_DEPLOY_HOST")
          [[ -n "${WEB_DEPLOY_USER}" ]] || missing+=("WEB_DEPLOY_USER")
          [[ -n "${WEB_DEPLOY_SSH_KEY}" ]] || missing+=("WEB_DEPLOY_SSH_KEY")
          [[ -n "${WEB_DEPLOY_KNOWN_HOSTS}" ]] || missing+=("WEB_DEPLOY_KNOWN_HOSTS")
          [[ -n "${WEB_PREVIEW_DEPLOY_PATH}" ]] || missing+=("WEB_PREVIEW_DEPLOY_PATH")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required web preview deploy secrets: ${missing[*]}"
            exit 1
          fi

      - name: Build web bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution

      - name: Configure SSH
        shell: bash
        run: |
          mkdir -p "${HOME}/.ssh"
          printf '%s\n' "${WEB_DEPLOY_SSH_KEY}" > "${HOME}/.ssh/deploy_key"
          printf '%s\n' "${WEB_DEPLOY_KNOWN_HOSTS}" > "${HOME}/.ssh/known_hosts"
          chmod 600 "${HOME}/.ssh/deploy_key"

      - name: Deploy web preview bundle
        shell: bash
        run: |
          rsync -az --delete \
            -e "ssh -i ${HOME}/.ssh/deploy_key" \
            composeApp/build/dist/wasmJs/productionExecutable/ \
            "${WEB_DEPLOY_USER}@${WEB_DEPLOY_HOST}:${WEB_PREVIEW_DEPLOY_PATH}/"
