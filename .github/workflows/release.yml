name: Release

on:
  push:
    tags:
      - 'release/*.*.*'
  workflow_dispatch:
    inputs:
      version:
        description: Semver version to release, for example 1.2.3
        required: true
        type: string

concurrency:
  group: release-${{ github.ref_name || inputs.version }}
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write

env:
  JAVA_VERSION: 17
  JAVA_DISTRIBUTION: temurin

jobs:
  version:
    name: Validate version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      tag_name: ${{ steps.version.outputs.tag_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate release version
        id: version
        shell: bash
        run: |
          version="$(grep '^phoebe.versionName=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]')"
          configured_version_code="$(grep '^phoebe.versionCode=' gradle.properties | cut -d'=' -f2- | tr -d '[:space:]' || true)"
          if [[ -z "${version}" ]]; then
            echo "::error::gradle.properties must define phoebe.versionName"
            exit 1
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.version }}" != "${version}" ]]; then
              echo "::error::workflow_dispatch version '${{ inputs.version }}' must match gradle.properties phoebe.versionName '${version}'"
              exit 1
            fi
            tag_name="release/${version}"
          else
            tag_name="${GITHUB_REF_NAME}"
            expected_tag_name="release/${version}"
            if [[ "${tag_name}" != "${expected_tag_name}" ]]; then
              echo "::error::release tag '${tag_name}' must match gradle.properties version '${expected_tag_name}'"
              exit 1
            fi
          fi

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Release version must be plain semver, like release/1.2.3"
            exit 1
          fi

          IFS='.' read -r major minor patch <<< "${version}"
          if (( major > 2100 || minor > 999 || patch > 999 )); then
            echo "::error::Version is too large to derive a safe Android versionCode"
            exit 1
          fi

          if [[ -n "${configured_version_code}" ]]; then
            if [[ ! "${configured_version_code}" =~ ^[0-9]+$ ]]; then
              echo "::error::phoebe.versionCode must be a positive integer"
              exit 1
            fi
            version_code="${configured_version_code}"
          else
            version_code=$((major * 1000000 + minor * 1000 + patch))
          fi
          {
            echo "version=${version}"
            echo "version_code=${version_code}"
            echo "tag_name=${tag_name}"
          } >> "${GITHUB_OUTPUT}"

  android:
    name: Android release
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Android signing secrets
        shell: bash
        run: |
          missing=()
          [[ -n "${ANDROID_KEYSTORE_BASE64}" ]] || missing+=("ANDROID_KEYSTORE_BASE64")
          [[ -n "${ANDROID_KEYSTORE_PASSWORD}" ]] || missing+=("ANDROID_KEYSTORE_PASSWORD")
          [[ -n "${ANDROID_KEY_ALIAS}" ]] || missing+=("ANDROID_KEY_ALIAS")
          [[ -n "${ANDROID_KEY_PASSWORD}" ]] || missing+=("ANDROID_KEY_PASSWORD")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required Android signing secrets: ${missing[*]}"
            exit 1
          fi

      - name: Configure Android signing
        shell: bash
        run: |
          keystore_path="${RUNNER_TEMP}/phoebe-release.jks"
          echo "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "${keystore_path}"
          {
            echo "PHOEBE_ANDROID_SIGNING_STORE_FILE=${keystore_path}"
            echo "PHOEBE_ANDROID_SIGNING_STORE_PASSWORD=${ANDROID_KEYSTORE_PASSWORD}"
            echo "PHOEBE_ANDROID_SIGNING_KEY_ALIAS=${ANDROID_KEY_ALIAS}"
            echo "PHOEBE_ANDROID_SIGNING_KEY_PASSWORD=${ANDROID_KEY_PASSWORD}"
          } >> "${GITHUB_ENV}"

      - name: Build Android APK and bundle
        run: >
          ./gradlew
          :composeApp:assembleRelease
          :composeApp:bundleRelease
          -Pphoebe.versionName=${{ needs.version.outputs.version }}
          -Pphoebe.versionCode=${{ needs.version.outputs.version_code }}

      - name: Collect Android release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          apk="$(find composeApp/build/outputs/apk/release -name '*.apk' -print -quit)"
          aab="$(find composeApp/build/outputs/bundle/release -name '*.aab' -print -quit)"
          if [[ -z "${apk}" || -z "${aab}" ]]; then
            echo "::error::Could not find Android APK and AAB release artifacts"
            exit 1
          fi
          cp "${apk}" "release-artifacts/Phoebe-${VERSION}.apk"
          cp "${aab}" "release-artifacts/Phoebe-${VERSION}.aab"
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          if-no-files-found: error
          path: release-artifacts/*

  linux:
    name: Linux release
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          sudo flatpak install --noninteractive flathub org.freedesktop.Platform//25.08 org.freedesktop.Sdk//25.08

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Linux package
        run: >
          ./gradlew
          :composeApp:packageReleaseDeb
          :composeApp:createReleaseDistributable
          -Pphoebe.versionName=${{ needs.version.outputs.version }}

      - name: Build Linux Flatpak bundle
        shell: bash
        run: |
          mkdir -p release-artifacts
          (
            cd composeApp/flatpak
            flatpak-builder \
              --force-clean \
              --repo="${GITHUB_WORKSPACE}/flatpak-repo" \
              "${GITHUB_WORKSPACE}/flatpak-build" \
              com.phoebe.app.yml
          )
          flatpak build-bundle \
            flatpak-repo \
            "release-artifacts/Phoebe-${VERSION}.flatpak" \
            com.phoebe.app \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Collect Linux release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          deb="$(find composeApp/build -name '*.deb' -print -quit)"
          if [[ -z "${deb}" ]]; then
            echo "::error::Could not find Linux DEB release artifact"
            exit 1
          fi
          flatpak_bundle="release-artifacts/Phoebe-${VERSION}.flatpak"
          if [[ ! -f "${flatpak_bundle}" ]]; then
            echo "::error::Could not find Linux Flatpak release artifact"
            exit 1
          fi
          cp "${deb}" "release-artifacts/Phoebe-${VERSION}.deb"
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-release
          if-no-files-found: error
          path: release-artifacts/*

  windows:
    name: Windows release
    needs: version
    runs-on: windows-latest
    timeout-minutes: 45
    environment: release
    env:
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_SIGNING_ENDPOINT: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
      AZURE_SIGNING_ACCOUNT_NAME: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
      AZURE_SIGNING_CERTIFICATE_PROFILE_NAME: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate Azure Artifact Signing settings
        shell: pwsh
        run: |
          $missing = @()
          if (-not $env:AZURE_CLIENT_ID) { $missing += "AZURE_CLIENT_ID" }
          if (-not $env:AZURE_TENANT_ID) { $missing += "AZURE_TENANT_ID" }
          if (-not $env:AZURE_SIGNING_ENDPOINT) { $missing += "AZURE_SIGNING_ENDPOINT" }
          if (-not $env:AZURE_SIGNING_ACCOUNT_NAME) { $missing += "AZURE_SIGNING_ACCOUNT_NAME" }
          if (-not $env:AZURE_SIGNING_CERTIFICATE_PROFILE_NAME) { $missing += "AZURE_SIGNING_CERTIFICATE_PROFILE_NAME" }
          if ($missing.Count -gt 0) {
            Write-Error "Missing required Azure Artifact Signing settings: $($missing -join ', ')"
            exit 1
          }

      - name: Build Windows package
        shell: pwsh
        run: >
          ./gradlew
          :composeApp:packageReleaseMsi
          "-Pphoebe.versionName=${{ needs.version.outputs.version }}"

      - name: Collect Windows release artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "release-artifacts" | Out-Null
          $msi = Get-ChildItem -Path "composeApp/build" -Recurse -Filter "*.msi" | Select-Object -First 1
          if (-not $msi) {
            throw "Could not find Windows MSI release artifact"
          }
          Copy-Item $msi.FullName "release-artifacts/Phoebe-${env:VERSION}.msi"
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Azure login
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          allow-no-subscriptions: true

      - name: Sign Windows installer
        uses: azure/artifact-signing-action@v1
        with:
          endpoint: ${{ secrets.AZURE_SIGNING_ENDPOINT }}
          signing-account-name: ${{ secrets.AZURE_SIGNING_ACCOUNT_NAME }}
          certificate-profile-name: ${{ secrets.AZURE_SIGNING_CERTIFICATE_PROFILE_NAME }}
          files-folder: ${{ github.workspace }}\release-artifacts
          files-folder-filter: msi
          files-folder-recurse: false
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release
          if-no-files-found: error
          path: release-artifacts/*

  macos:
    name: macOS release
    needs: version
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      MACOS_CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE_BASE64 }}
      MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
      MACOS_DEVELOPER_IDENTITY: ${{ secrets.MACOS_DEVELOPER_IDENTITY }}
      MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate macOS signing secrets
        shell: bash
        run: |
          missing=()
          [[ -n "${MACOS_CERTIFICATE_BASE64}" ]] || missing+=("MACOS_CERTIFICATE_BASE64")
          [[ -n "${MACOS_CERTIFICATE_PASSWORD}" ]] || missing+=("MACOS_CERTIFICATE_PASSWORD")
          [[ -n "${MACOS_DEVELOPER_IDENTITY}" ]] || missing+=("MACOS_DEVELOPER_IDENTITY")
          [[ -n "${MACOS_KEYCHAIN_PASSWORD}" ]] || missing+=("MACOS_KEYCHAIN_PASSWORD")
          [[ -n "${APPLE_ID}" ]] || missing+=("APPLE_ID")
          [[ -n "${APPLE_APP_SPECIFIC_PASSWORD}" ]] || missing+=("APPLE_APP_SPECIFIC_PASSWORD")
          [[ -n "${APPLE_TEAM_ID}" ]] || missing+=("APPLE_TEAM_ID")
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required macOS signing/notarization secrets: ${missing[*]}"
            exit 1
          fi

      - name: Import macOS signing certificate
        shell: bash
        run: |
          cert_path="${RUNNER_TEMP}/developer-id.p12"
          keychain_path="${RUNNER_TEMP}/app-signing.keychain-db"
          echo "${MACOS_CERTIFICATE_BASE64}" | base64 --decode > "${cert_path}"

          security create-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security set-keychain-settings -lut 21600 "${keychain_path}"
          security unlock-keychain -p "${MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"
          security import "${cert_path}" -P "${MACOS_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${keychain_path}"
          security list-keychains -d user -s "${keychain_path}" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${MACOS_KEYCHAIN_PASSWORD}" "${keychain_path}"

          {
            echo "compose.desktop.mac.sign=true"
            echo "compose.desktop.mac.signing.identity=${MACOS_DEVELOPER_IDENTITY}"
            echo "compose.desktop.mac.signing.keychain=${keychain_path}"
          } >> "${HOME}/.gradle/gradle.properties"

      - name: Build macOS package
        shell: bash
        run: >
          ./gradlew
          :composeApp:packageReleaseDmg
          -Pphoebe.versionName=${{ needs.version.outputs.version }}

      - name: Notarize macOS package
        shell: bash
        run: |
          dmg="$(find composeApp/build -name '*.dmg' -print -quit)"
          if [[ -z "${dmg}" ]]; then
            echo "::error::Could not find DMG to notarize"
            exit 1
          fi
          xcrun notarytool submit "${dmg}" \
            --apple-id "${APPLE_ID}" \
            --password "${APPLE_APP_SPECIFIC_PASSWORD}" \
            --team-id "${APPLE_TEAM_ID}" \
            --wait
          xcrun stapler staple "${dmg}"

      - name: Collect macOS release artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          dmg="$(find composeApp/build -name '*.dmg' -print -quit)"
          if [[ -z "${dmg}" ]]; then
            echo "::error::Could not find macOS DMG release artifact"
            exit 1
          fi
          cp "${dmg}" "release-artifacts/Phoebe-${VERSION}.dmg"
        env:
          VERSION: ${{ needs.version.outputs.version }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-release
          if-no-files-found: error
          path: release-artifacts/*

  github-release:
    name: Create GitHub release
    needs:
      - version
      - android
      - linux
      - windows
      - macos
    if: always() && needs.version.result == 'success' && needs.android.result == 'success' && needs.linux.result == 'success' && needs.windows.result == 'success' && needs.macos.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag_name }}
          name: Phoebe ${{ needs.version.outputs.version }}
          draft: true
          generate_release_notes: true
          files: |
            release-artifacts/**/*.apk
            release-artifacts/**/*.aab
            release-artifacts/**/*.deb
            release-artifacts/**/*.flatpak
            release-artifacts/**/*.msi
            release-artifacts/**/*.dmg
